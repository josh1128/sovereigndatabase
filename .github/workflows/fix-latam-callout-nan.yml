name: Fix LATAM callout guard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-latam-callout-nan.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/fix_latam_callout_nan.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.py
          git commit -m "Fix LATAM callout value guard"
          git push
