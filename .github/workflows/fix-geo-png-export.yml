name: Fix geo PNG export

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-geo-png-export.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/fix_geo_png_export.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.py
          git commit -m "Fix regional map PNG export layout"
          git push
