name: Cleanup Middle East summary

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-middle-east-summary.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/cleanup_middle_east_summary.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.py
          git commit -m "Clean duplicate Middle East summary blocks"
          git push
