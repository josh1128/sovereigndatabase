name: Final map label cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-map-label-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/final_map_label_cleanup.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.py
          git commit -m "Refine Venezuela Russia and Africa map labels"
          git push
