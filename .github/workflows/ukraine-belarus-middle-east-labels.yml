name: Europe values and Middle East labels

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ukraine-belarus-middle-east-labels.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/ukraine_belarus_middle_east_labels.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.py
          git commit -m "Show Ukraine Belarus values and hide Middle East labels"
          git push
