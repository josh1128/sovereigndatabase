name: Move Venezuela label closer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/move-venezuela-label-closer.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/move_venezuela_label_closer.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.py
          if git diff --cached --quiet; then
            echo "No dashboard changes needed"
          else
            git commit -m "Move Venezuela label closer to pointer"
            git push
          fi
