name: Move Venezuela callout right

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/move-venezuela-callout-right.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/move_venezuela_callout_right.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.py
          git commit -m "Move Venezuela callout to right side"
          git push
