name: Tighten Asia crop and callouts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tighten-asia-and-callouts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/tighten_asia_and_callouts.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.py
          git commit -m "Tighten Asia crop and clarify LATAM callouts"
          git push
