name: Middle East arrow callouts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/middle-east-arrow-callouts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/middle_east_arrow_callouts.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.py
          git commit -m "Replace Middle East summary with arrow callouts"
          git push
