name: Apply world map styling v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/world-map-apply-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/patch_world_map.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.py
          git commit -m "Match world map to appendix reference"
          git push
