name: Shorten Venezuela arrow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/shorten-venezuela-arrow.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/shorten_venezuela_arrow.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.py
          if git diff --cached --quiet; then
            echo "No dashboard changes needed"
          else
            git commit -m "Shorten Venezuela map arrow"
            git push
          fi
