name: Keep map legends inside

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/keep-map-legends-inside.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/keep_map_legends_inside.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.py
          git commit -m "Keep regional map legends inside map area"
          git push

# trigger
