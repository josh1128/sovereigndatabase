name: Include Russia in Europe choropleth

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/include-russia-europe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/include_russia_europe.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.py
          git commit -m "Highlight Russia in Europe map"
          git push
