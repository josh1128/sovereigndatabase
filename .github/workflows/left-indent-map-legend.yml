name: Left indent map legend

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/left-indent-map-legend.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/left_indent_map_legend.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.py
          git commit -m "Shift map legend left"
          git push
