name: Fix Middle East choropleth

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-middle-east-choropleth.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/fix_middle_east_choropleth.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.py
          git commit -m "Show Middle East default colours in Asia map"
          git push
