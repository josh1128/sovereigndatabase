name: Simplify Asia Middle East

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/simplify-asia-middle-east.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/simplify_asia_middle_east.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.py
          git commit -m "Simplify Asia Middle East highlighting and labels"
          git push
