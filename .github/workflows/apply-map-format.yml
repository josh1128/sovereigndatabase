name: Apply regional map formatting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update dashboard map formatting
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('dashboard.py')
          text = path.read_text(encoding='utf-8')

          # Prevent the follow-up commit from applying the patch twice.
          if 'MAP_FORMAT_V2' in text:
              print('Map formatting already applied.')
              raise SystemExit(0)

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected 1 match, found {count}')
              text = text.replace(old, new, 1)

          # Remove the old fixed title. The figure itself will get a dynamic title
          # so the title is also included in exported PNGs.
          replace_once(
              'with tab_map:\n    st.subheader("Figure A-1: Global debt in default")\n',
              'with tab_map:\n    # MAP_FORMAT_V2: reference-style regional maps with larger labels.\n',
              'old map subheader',
          )

          replace_once(
              "    REGION_HEIGHTS = {'World':780,'Africa':900,'Asia':760,'Europe':720,'North America':820,'South America':900}\n",
              "    REGION_HEIGHTS = {'World':860,'Africa':980,'Asia':880,'Europe':840,'North America':900,'South America':980}\n",
              'regional heights',
          )

          old_controls = '''    with c2:\n        region = st.selectbox("Regional extract",list(REGION_BOUNDS),index=0,key="map_region")\n\n    st.caption("Country polygons are always shown. Regional extracts suppress tiny or crowded labels; hidden country names remain available through hover and the table below.")\n'''
          new_controls = '''    with c2:\n        region = st.selectbox("Regional extract",list(REGION_BOUNDS),index=0,key="map_region")\n\n    FIGURE_TITLES = {\n        'World': 'Figure A-1: Debt in default, World',\n        'Europe': 'Figure A-2: Debt in default, Europe',\n        'Asia': 'Figure A-3: Debt in default, Asia Pacific',\n        'North America': 'Figure A-4: Debt in default, North America and the Caribbean',\n        'South America': 'Figure A-5: Debt in default, Latin America',\n        'Africa': 'Figure A-6: Debt in default, Africa',\n    }\n\n    st.caption(\n        "Country polygons are always shown. Regional extracts use larger country "\n        "labels while suppressing tiny or crowded names. Hidden country names "\n        "remain available through hover and the table below."\n    )\n'''
          replace_once(old_controls, new_controls, 'map controls and title mapping')

          replace_once(
              "    REGION_LABEL_SIZE = {'World':7.5,'Africa':9,'Asia':8,'Europe':7,'North America':9,'South America':9}\n",
              "    REGION_LABEL_SIZE = {'World':10,'Africa':12,'Asia':11,'Europe':10,'North America':11,'South America':12}\n",
              'regional label sizes',
          )

          replace_once(
              "    REGION_MAX_LABELS = {'North America':13,'South America':12,'Europe':18,'Africa':24,'Asia':22}\n",
              "    REGION_MAX_LABELS = {'North America':14,'South America':12,'Europe':18,'Africa':22,'Asia':18}\n",
              'regional label caps',
          )

          replace_once(
              "textfont=dict(color='#243447',size=15,family='Arial')",
              "textfont=dict(color='#243447',size=20,family='Arial')",
              'world continent label font',
          )

          old_layout = "    fig_map.update_layout(height=REGION_HEIGHTS.get(region,780),geo=geo_kw,title=None if region != 'World' else dict(text=f'Total debt in default by country, {map_year} (US$ millions)',x=0.01,font=dict(size=14,color='#222')),legend=dict(title=dict(text=legend_title,font=dict(size=13,color='#111111')),x=0.02,y=0.03,xanchor='left',yanchor='bottom',bgcolor='rgba(255,255,255,0.95)',bordercolor='#c7c7c7',borderwidth=1,font=dict(size=11,color='#111111'),itemsizing='constant',traceorder='normal'),margin=dict(l=0,r=0,t=20 if region != 'World' else 45,b=0),paper_bgcolor='white')\n"
          new_layout = "    fig_map.update_layout(height=REGION_HEIGHTS.get(region,860),geo=geo_kw,title=dict(text=FIGURE_TITLES.get(region, f'Debt in default, {region}'),x=0.01,xanchor='left',font=dict(size=18,color='#1b6f8a')),legend=dict(title=dict(text=legend_title,font=dict(size=15,color='#111111')),x=0.02,y=0.03,xanchor='left',yanchor='bottom',bgcolor='rgba(255,255,255,0.96)',bordercolor='#b8b8b8',borderwidth=1,font=dict(size=13,color='#111111'),itemsizing='constant',traceorder='normal'),margin=dict(l=0,r=0,t=70,b=0),paper_bgcolor='white',font=dict(family='Arial',size=13,color='#222222'))\n"
          replace_once(old_layout, new_layout, 'map layout')

          # Increase the default regional fallback as well.
          replace_once(
              "size=REGION_LABEL_SIZE.get(region,8),family='Arial'",
              "size=REGION_LABEL_SIZE.get(region,11),family='Arial'",
              'regional fallback font',
          )

          # Syntax-check before writing.
          compile(text, str(path), 'exec')
          path.write_text(text, encoding='utf-8')
          print('Map formatting updated and syntax check passed.')
          PY

      - name: Commit dashboard update
        shell: bash
        run: |
          if git diff --quiet -- dashboard.py; then
            echo "No dashboard changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.py
          git commit -m "Increase regional map fonts and add reference-style titles [skip ci]"
          git push origin HEAD:main
