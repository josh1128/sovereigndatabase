name: Widen map legend title

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/widen-map-legend-title.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/widen_map_legend_title.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.py
          git commit -m "Widen map legend title"
          git push
