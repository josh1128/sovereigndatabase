name: Enlarge world map labels

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enlarge-world-labels.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/enlarge_world_labels.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.py
          git commit -m "Enlarge and bold world map labels"
          git push
