name: Left indent legend values more

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/left-indent-legend-values-more.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/left_indent_legend_values_more.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.py
          if git diff --cached --quiet; then
            echo "No dashboard changes needed"
          else
            git commit -m "Tighten legend values further left"
            git push
          fi
