name: Refine regional maps v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-regional-maps-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/refine_regional_maps_v3.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.py
          git commit -m "Refine regional map layout and callouts"
          git push
